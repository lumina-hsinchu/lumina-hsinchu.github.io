<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f1f1f1">
<title>LUMINA AI 解籤｜我的籤詩</title>
<meta property="og:title" content="LUMINA AI 解籤｜我的籤詩">
<meta property="og:description" content="新竹文創館 LUMINA AI 解籤體驗，收下屬於你的籤詩。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f1f1f1;
    --paper: #fbfbfa;
    --ink: #0e334d;
    --ink-soft: #5a6f7f;
    --accent: #8f7798;
    --line: #d9d6dc;
    /* 籤詩卡比例 600 × 981 */
    --card-ratio: 0.6116;
    /* 卡片以外需要的高度：標題、按鈕、提示、頁尾 */
    --chrome: 300px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(120% 55% at 50% 0%, #ffffff 0%, rgba(255,255,255,0) 62%),
      var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
  }

  header { text-align: center; margin: 4px 0 14px; }
  .eyebrow {
    margin: 0 0 4px; padding-left: .32em;
    font-size: 11.5px; letter-spacing: .32em; color: var(--accent);
  }
  h1 {
    margin: 0; padding-left: .14em;
    font-family: "Noto Serif TC", serif; font-weight: 700;
    font-size: 26px; letter-spacing: .14em; line-height: 1.25;
  }

  main {
    width: 100%;
    /* 卡片寬度同時受螢幕寬度與高度限制，讓手機一個畫面就能看到整張籤詩與按鈕 */
    --w: min(100%, 420px, max(220px, calc((100dvh - var(--chrome)) * var(--card-ratio))));
    display: flex; flex-direction: column; align-items: center;
  }

  .card {
    position: relative; display: block;
    width: var(--w);
    aspect-ratio: 600 / 981;
    background: var(--paper);
    border-radius: 14px;
    box-shadow: 0 1px 0 rgba(14,51,77,.05), 0 20px 44px -22px rgba(14,51,77,.42);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .card img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    opacity: 0; transform: translateY(6px);
    transition: opacity .6s ease, transform .6s ease;
    -webkit-touch-callout: default;
  }
  .card img.ready { opacity: 1; transform: none; }
  .card .loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--ink-soft); font-size: 14px; letter-spacing: .1em;
  }

  .save-tip {
    width: min(100%, max(var(--w), 340px));
    margin-top: 16px;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border-radius: 14px;
    background: #fff4d6;
    border: 2px solid #f0b429;
    box-shadow: 0 10px 22px -16px rgba(150,100,0,.6);
    color: var(--ink);
    animation: tip-pulse 2.4s ease-in-out 1s 3;
  }
  .save-tip svg { width: 30px; height: 30px; flex: none; color: #c98a00; }
  .save-tip p { margin: 0; font-size: 15.5px; line-height: 1.55; font-weight: 600; letter-spacing: .03em; }
  .save-tip strong { display: block; font-size: 21px; line-height: 1.35; color: #b4380f; font-weight: 800; letter-spacing: .08em; }
  .save-tip small { display: block; margin-top: 2px; font-size: 13px; font-weight: 500; color: var(--ink-soft); letter-spacing: 0; }
  @keyframes tip-pulse {
    0%, 100% { box-shadow: 0 10px 22px -16px rgba(150,100,0,.6), 0 0 0 0 rgba(240,180,41,.55); }
    50%      { box-shadow: 0 10px 22px -16px rgba(150,100,0,.6), 0 0 0 8px rgba(240,180,41,0); }
  }

  .empty {
    width: 100%; max-width: 420px; text-align: center; padding: 48px 20px;
    background: var(--paper); border-radius: 14px; border: 1px dashed var(--line);
    line-height: 1.9; color: var(--ink-soft);
  }
  .empty strong { color: var(--ink); font-family: "Noto Serif TC", serif; font-size: 18px; }

  footer {
    margin-top: auto; padding-top: 22px; text-align: center;
    font-size: 11px; letter-spacing: .1em; line-height: 1.8; color: var(--ink-soft);
  }
  footer span {
    display: inline-block; width: 4px; height: 4px; border-radius: 50%;
    background: var(--accent); vertical-align: middle; margin: 0 8px;
  }

  @media (prefers-reduced-motion: reduce) {
    .card img { transition: none; transform: none; }
    .save-tip { animation: none; }
  }
</style>
</head>
<body>
  <header>
    <p class="eyebrow">LUMINA AI 解籤・新竹文創館</p>
    <h1>我的籤詩</h1>
  </header>

  <main id="main"></main>

  <footer>中華電信新竹營運處<span></span>新竹文創館</footer>

<script>
(function () {
  var main = document.getElementById('main');

  function showEmpty(title, text) {
    main.innerHTML = '<div class="empty"><strong>' + title + '</strong><br>' + text + '</div>';
  }

  // 網址格式：/?k=8碼隨機代碼（不含籤號，無法用改數字的方式看到其他籤）
  var k = (new URLSearchParams(location.search).get('k') || '').toLowerCase();
  if (!/^[0-9a-f]{8}$/.test(k)) {
    showEmpty('請掃描現場的 QR Code', '完成 LUMINA 解籤後，<br>即可在這裡收下屬於你的籤詩。');
    return;
  }

  var src = 'cards/' + k + '.jpg';

  main.innerHTML =
    '<div class="card">' +
      '<div class="loading" id="loading">籤詩載入中…</div>' +
      '<img id="cardImg" alt="LUMINA 籤詩" decoding="async">' +
    '</div>' +
    '<div class="save-tip" role="note">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>' +
      '<p><strong>長按籤詩圖片下載</strong>選擇「儲存圖片」即可存到手機' +
      '<small>LINE 內開啟時，也可以長按圖片儲存</small></p>' +
    '</div>';

  var img = document.getElementById('cardImg');
  img.onload = function () {
    img.classList.add('ready');
    var l = document.getElementById('loading'); if (l) l.remove();
  };
  img.onerror = function () {
    showEmpty('找不到這支籤詩', '請重新掃描現場的 QR Code。');
  };
  img.src = src;
})();
</script>
</body>
</html>
