<head>
<meta charset="utf-8">

<title>籤詩 QR 工作人員版</title>

<style>
  /* 版面：左邊（手機在上）是給民眾掃的大 QR，右邊（手機在下）是給工作人員點的 1–60 籤號盤 */
  :root {
    --bg: #eceff2;
    --surface: #ffffff;
    --fg: #13293a;
    --muted: #5d6c79;
    --line: #d5dbe1;
    --accent: #0e334d;
    --accent-fg: #ffffff;
    --violet: #7d6487;
    --qr-paper: #ffffff;
    --qr-ink: #000000;
    --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-num: "Space Grotesk", "Noto Sans TC", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d151c; --surface: #16222c; --fg: #e5ecf2; --muted: #96a5b2; --line: #2a3a47;
      --accent: #c9b3d4; --accent-fg: #1a1220; --violet: #c9b3d4;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d151c; --surface: #16222c; --fg: #e5ecf2; --muted: #96a5b2; --line: #2a3a47;
    --accent: #c9b3d4; --accent-fg: #1a1220; --violet: #c9b3d4;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 24px;
  }

  .app {
    max-width: 1200px; margin: 0 auto;
    display: grid; gap: 20px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 900px) {
    .app { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; min-height: 100%; }
    .stage { position: sticky; top: 16px; }
  }

  /* ── 民眾掃描區 ── */
  .stage {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    min-width: 0;
  }
  .eyebrow {
    margin: 0; font-size: 12px; letter-spacing: .24em; color: var(--violet);
    text-align: center;
  }
  .qr-card {
    width: min(100%, 60vh, 460px);
    aspect-ratio: 1;
    max-width: 100%;
    background: var(--qr-paper);
    border-radius: 20px;
    padding: 4%;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 24px 48px -28px rgba(14,51,77,.55);
  }
  @media (min-width: 900px) { .qr-card { width: min(100%, 68vh, 560px); } }
  .qr-card svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
  .qr-card svg path { fill: var(--qr-ink); }

  .pick-row {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    width: min(100%, 460px);
  }
  .label {
    margin: 0; flex: 1; text-align: center;
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(30px, 7vw, 46px); letter-spacing: .08em; line-height: 1.15;
  }
  .label .num {
    font-family: var(--font-num); font-variant-numeric: tabular-nums;
    letter-spacing: 0; margin: 0 .12em;
  }
  .step {
    width: 56px; height: 56px; flex: none;
    border-radius: 50%; border: 1.5px solid var(--line);
    background: var(--surface); color: var(--fg);
    display: grid; place-items: center; cursor: pointer;
  }
  .step svg { width: 22px; height: 22px; }
  .step:hover { border-color: var(--accent); }
  .tip {
    margin: 0; text-align: center; font-size: 15px; line-height: 1.6; color: var(--muted);
  }
  .tip strong { color: var(--fg); }

  /* ── 工作人員選號區 ── */
  .picker {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    display: flex; flex-direction: column; gap: 14px;
    min-width: 0;
  }
  .picker-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .picker h2 { margin: 0; font-size: 17px; letter-spacing: .06em; }
  .picker-head small { color: var(--muted); font-size: 12.5px; }

  .grid {
    display: grid; gap: 8px;
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(10, minmax(0, 1fr)); } }
  .grid button {
    aspect-ratio: 1; min-height: 44px;
    border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg);
    font-family: var(--font-num); font-variant-numeric: tabular-nums;
    font-size: 18px; font-weight: 700; cursor: pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .grid button:hover { border-color: var(--accent); }
  .grid button[aria-pressed="true"] {
    background: var(--accent); color: var(--accent-fg); border-color: var(--accent);
  }

  .direct { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .direct label { font-size: 14px; color: var(--muted); }
  .direct input {
    width: 96px; height: 44px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--fg);
    font-family: var(--font-num); font-size: 18px; font-weight: 700;
  }
  .direct .link { margin-left: auto; font-size: 13px; color: var(--muted); }
  .direct .link a { color: var(--violet); }

  button:focus-visible, input:focus-visible, a:focus-visible {
    outline: 3px solid var(--violet); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) { .grid button { transition: none; } }
</style>

<style>
  .lock {
    min-height: 100%;
    display: grid; place-items: center;
  }
  .lock-card {
    width: min(100%, 380px);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px 22px 24px;
    display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 24px 48px -32px rgba(14,51,77,.55);
  }
  .lock-card h1 {
    margin: 0; font-family: var(--font-display); font-size: 26px; letter-spacing: .08em; text-align: center;
  }
  .lock-card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; text-align: center; }
  .lock-card form { display: flex; flex-direction: column; gap: 10px; }
  .lock-card input {
    height: 52px; padding: 0 14px; text-align: center;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); color: var(--fg);
    font-family: var(--font-num); font-size: 24px; font-weight: 700; letter-spacing: .3em;
  }
  .lock-card button[type="submit"] {
    height: 50px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: var(--accent-fg);
    font-size: 16px; font-weight: 700; letter-spacing: .1em;
  }
  .lock-card button[disabled] { opacity: .6; cursor: progress; }
  .lock-error { color: #c0392b !important; font-weight: 600; min-height: 1.6em; }
  .relock {
    border: 0; background: none; color: var(--muted); cursor: pointer;
    font-size: 12.5px; text-decoration: underline; padding: 0;
  }
</style>
</head>
<body>
<section class="lock" id="lock">
  <div class="lock-card">
    <p class="eyebrow">LUMINA AI 解籤・新竹文創館</p>
    <h1>工作人員專用</h1>
    <p>請輸入工作人員密碼。<br>同一台裝置只需要輸入一次。</p>
    <form id="lockForm" autocomplete="off">
      <input id="pass" type="password" inputmode="numeric" autocomplete="current-password" aria-label="工作人員密碼" placeholder="••••••••">
      <button type="submit" id="unlockBtn">解鎖</button>
    </form>
    <p class="lock-error" id="lockError" role="alert"></p>
  </div>
</section>

<main class="app" id="app" hidden>
  <section class="stage" aria-live="polite">
    <p class="eyebrow">LUMINA AI 解籤・新竹文創館｜工作人員用</p>
    <div class="qr-card">
      <svg id="qr" viewBox="-4 -4 41 41" role="img" aria-label="籤詩 QR Code"><path id="qrPath" d=""></path></svg>
    </div>
    <div class="pick-row">
      <button class="step" id="prev" type="button" aria-label="上一籤">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1 class="label" id="label">第<span class="num">1</span>籤</h1>
      <button class="step" id="next" type="button" aria-label="下一籤">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
    <p class="tip">請民眾用<strong>手機相機</strong>掃描，<br>即可開啟並長按儲存自己的籤詩</p>
  </section>

  <section class="picker">
    <div class="picker-head">
      <h2>選擇籤號</h2>
      <small>電腦可直接打數字切換，← → 上下一籤</small>
    </div>
    <div class="grid" id="grid"></div>
    <div class="direct">
      <label for="numInput">輸入籤號</label>
      <input id="numInput" type="number" inputmode="numeric" min="1" max="60" placeholder="1–60">
      <span class="link">確認內容：<a id="openLink" href="#" target="_blank" rel="noopener">開啟這支籤的頁面</a>　<button type="button" class="relock" id="relock">鎖定此裝置</button></span>
    </div>
  </section>
</main>

<script>
function startApp(DATA) {
  var TOTAL = DATA.length;
  var byNum = {};
  DATA.forEach(function (d) { byNum[d.n] = d; });

  var grid = document.getElementById('grid');
  var qrPath = document.getElementById('qrPath');
  var label = document.getElementById('label');
  var input = document.getElementById('numInput');
  var openLink = document.getElementById('openLink');
  var stage = document.querySelector('.stage');
  var buttons = [];
  var current = 0;

  for (var i = 1; i <= TOTAL; i++) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = i;
    b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', '第 ' + i + ' 籤');
    b.dataset.n = i;
    grid.appendChild(b);
    buttons.push(b);
  }

  function select(n, opts) {
    n = parseInt(n, 10);
    if (!(n >= 1 && n <= TOTAL)) return;
    var d = byNum[n];
    if (!d) return;
    if (current) buttons[current - 1].setAttribute('aria-pressed', 'false');
    current = n;
    buttons[n - 1].setAttribute('aria-pressed', 'true');
    qrPath.setAttribute('d', d.d);
    label.innerHTML = '第<span class="num">' + n + '</span>籤';
    openLink.href = d.url;
    try { localStorage.setItem('staffqr-last', String(n)); } catch (e) {}
    if (location.hash !== '#q' + n) {
      try { history.replaceState(null, '', '#q' + n); } catch (e) { location.hash = 'q' + n; }
    }
    // 手機直式：點完籤號後捲回 QR，讓民眾直接掃
    if (opts && opts.scroll && window.matchMedia('(max-width: 899px)').matches) {
      stage.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  grid.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b) select(b.dataset.n, { scroll: true });
  });
  document.getElementById('prev').addEventListener('click', function () { select(current <= 1 ? TOTAL : current - 1); });
  document.getElementById('next').addEventListener('click', function () { select(current >= TOTAL ? 1 : current + 1); });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { select(input.value, { scroll: true }); input.select(); }
  });
  input.addEventListener('change', function () { select(input.value, { scroll: true }); });

  // 鍵盤：直接打數字（1.2 秒內連打兩位數），← → 切換
  var buf = '', bufTimer = null;
  document.addEventListener('keydown', function (e) {
    if (e.target === input || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { select(current <= 1 ? TOTAL : current - 1); e.preventDefault(); return; }
    if (e.key === 'ArrowRight') { select(current >= TOTAL ? 1 : current + 1); e.preventDefault(); return; }
    if (/^[0-9]$/.test(e.key)) {
      buf = (buf + e.key).slice(-2);
      clearTimeout(bufTimer);
      var v = parseInt(buf, 10);
      if (buf.length === 2 || v > 6) { select(v); buf = ''; }
      else bufTimer = setTimeout(function () { select(parseInt(buf, 10)); buf = ''; }, 1200);
    }
  });

  window.addEventListener('hashchange', function () {
    var m = /^#q(\d{1,2})$/.exec(location.hash);
    if (m && +m[1] !== current) select(m[1]);
  });

  // 螢幕常亮（瀏覽器允許時）
  var lock = null;
  function keepAwake() {
    if (!('wakeLock' in navigator) || lock) return;
    navigator.wakeLock.request('screen').then(function (l) {
      lock = l; l.addEventListener('release', function () { lock = null; });
    }).catch(function () {});
  }
  document.addEventListener('pointerdown', keepAwake);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') keepAwake(); });

  // 開啟時：網址指定的籤 → 上次選的籤 → 第 1 籤
  var start = 1;
  var hm = /^#q(\d{1,2})$/.exec(location.hash);
  if (hm) start = +hm[1];
  else { try { var last = parseInt(localStorage.getItem('staffqr-last'), 10); if (last >= 1 && last <= TOTAL) start = last; } catch (e) {} }
  select(start);

var PASS_KEY = 'staffqr-pass';

function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }

async function decrypt(pass) {
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

var lock = document.getElementById('lock');
var app = document.getElementById('app');
var form = document.getElementById('lockForm');
var passInput = document.getElementById('pass');
var btn = document.getElementById('unlockBtn');
var err = document.getElementById('lockError');

async function tryUnlock(pass, remember) {
  btn.disabled = true; btn.textContent = '解鎖中…'; err.textContent = '';
  try {
    var data = await decrypt(pass);
    if (remember) { try { localStorage.setItem(PASS_KEY, pass); } catch (e) {} }
    lock.hidden = true; app.hidden = false;
    startApp(data);
    return true;
  } catch (e) {
    return false;
  } finally {
    btn.disabled = false; btn.textContent = '解鎖';
  }
}

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  var ok = await tryUnlock(passInput.value.trim(), true);
  if (!ok) { err.textContent = '密碼不正確，請再試一次'; passInput.select(); }
});

document.getElementById('relock').addEventListener('click', function () {
  try { localStorage.removeItem(PASS_KEY); } catch (e) {}
  location.reload();
});

(async function () {
  if (!window.crypto || !crypto.subtle) {
    err.textContent = '這個瀏覽器無法解鎖，請改用 Chrome、Edge 或 Safari 開啟';
    btn.disabled = true; return;
  }
  var saved = null;
  try { saved = localStorage.getItem(PASS_KEY); } catch (e) {}
  if (saved && await tryUnlock(saved, false)) return;
  if (saved) { try { localStorage.removeItem(PASS_KEY); } catch (e) {} }
  passInput.focus();
})();
</script>
